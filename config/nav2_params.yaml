fast_lio_odom_adapter:
  ros__parameters:
    input_topic: /Odometry_loc
    output_topic: /odom
    odom_frame: odom
    tracking_frame: lidar_imu_chest_front
    base_frame: base_link
    tf_timeout_sec: 0.05

nav2_zmq_velocity_bridge:
  ros__parameters:
    command_topic: /cmd_vel
    zmq_endpoint: tcp://*:8558
    publish_rate_hz: 20.0
    command_timeout_sec: 0.20

lidar_cloud_throttle:
  ros__parameters:
    input_topic: /aima/hal/sensor/lidar_chest_front/lidar_pointcloud
    output_topic: /scan_nav/cloud
    max_rate_hz: 10.0
    timestamp_offset_sec: 0.0
    target_frame: base_link
    tf_timeout_sec: 0.05
    voxel_size: 0.05
    min_height: -0.45
    max_height: 0.30
    max_input_points: 40000

# This is the carrying-box self-return envelope, not the robot footprint.
# It removes LiDAR returns from the held box while ManipulationState is HOLDING.
# Collision Monitor and Nav2 use their own tuned robot footprint below.
payload_cloud_filter:
  ros__parameters:
    min_x: 0.20
    max_x: 0.50
    min_y: -0.22
    max_y: 0.22
    min_z: 0.03
    max_z: 0.56

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 5.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: 0.0
      max_vel_x: 0.5
      min_vel_y: 0.0
      max_vel_y: 0.0
      min_vel_theta: -1.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      max_speed_theta: 1.0
      acc_lim_x: 0.5
      decel_lim_x: -0.5
      acc_lim_y: 0.0
      decel_lim_y: 0.0
      acc_lim_theta: 0.5
      decel_lim_theta: -0.5
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 5.0
      xy_goal_tolerance: 0.20
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.15
      GoalAlign.scale: 18.0
      GoalAlign.forward_point_distance: 0.15
      PathDist.scale: 24.0
      GoalDist.scale: 18.0
      RotateToGoal.scale: 20.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

fine_align_server:
  ros__parameters:
    use_sim_time: false
    fixed_frame: odom
    base_frame: base_link
    odom_topic: /odom
    tag_frame: tag9
    tag_id: 9
    detections_topic: /front_center_rectify/detections
    minimum_decision_margin: 20.0
    standoff: 0.5
    lateral_offset: 0.0
    yaw_offset: 0.0
    maximum_pose_age: 2.5
    maximum_sample_gap: 2.5
    stable_sample_count: 3
    maximum_position_spread: 0.1
    maximum_angular_spread: 0.174532925
    capture_distance: 1.5
    capture_lateral: 1.5
    capture_yaw: 0.785398163
    allow_reverse_x: true
    reverse_capture_distance: 0.3
    acquisition_timeout: 6.0
    approach_timeout: 45.0
    maximum_retries: 2
    retry_delay: 1.0
    command_timeout: 0.2
    collision_stop_timeout: 1.0
    odometry_timeout: 0.5
    controller_frequency: 20.0
    progress_log_interval: 1.0
    undock_distance: 0.3
    undock_timeout: 10.0
    undock_translation_speed_min: 0.1
    undock_translation_speed_max: 0.1
    undock_angular_speed_min: 0.1
    undock_angular_speed_max: 0.1
    translation_gain: 0.5
    yaw_gain: 1.0
    translation_speed_min: 0.1
    translation_speed_max: 0.2
    angular_speed_min: 0.1
    angular_speed_max: 0.2
    translation_yaw_stop: 0.3490658504
    x_position_tolerance: 0.08
    y_position_tolerance: 0.08
    yaw_tolerance: 0.0872664626
    settled_linear_velocity: 0.03
    settled_angular_velocity: 0.05
    settled_sample_count: 3

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_raw
    cmd_vel_out_topic: /cmd_vel
    transform_tolerance: 1.0
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 1.0
    # Includes the X2 base and the full carried-payload envelope at all times.
    polygons: [RobotFootprintStop]
    RobotFootprintStop:
      type: polygon
      points: [0.15, 0.30, 0.15, -0.30, -0.15, -0.30, -0.15, 0.30]
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: /fine_align/collision_stop_polygon
      enabled: true
    observation_sources: [chest_cloud]
    chest_cloud:
      type: pointcloud
      topic: /scan_nav/payload_filtered_cloud
      min_height: -0.45
      max_height: 0.30
      enabled: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.15, 0.30], [0.15, -0.30], [-0.15, -0.30], [-0.15, 0.30]]"
      transform_tolerance: 5.0
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        min_obstacle_height: -1.0
        max_obstacle_height: 2.0
        footprint_clearing_enabled: true
        observation_sources: chest_cloud
        chest_cloud:
          topic: /scan_nav/payload_filtered_cloud
          sensor_frame: lidar_chest_front
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.20
          obstacle_max_range: 5.0
          raytrace_min_range: 0.20
          raytrace_max_range: 5.5
          observation_persistence: 1.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.0
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      footprint: "[[0.15, 0.30], [0.15, -0.30], [-0.15, -0.30], [-0.15, 0.30]]"
      transform_tolerance: 5.0
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        transform_tolerance: 5.0
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        min_obstacle_height: -1.0
        max_obstacle_height: 2.0
        footprint_clearing_enabled: true
        observation_sources: chest_cloud
        chest_cloud:
          topic: /scan_nav/payload_filtered_cloud
          sensor_frame: lidar_chest_front
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.20
          obstacle_max_range: 5.0
          raytrace_min_range: 0.20
          raytrace_max_range: 5.5
          observation_persistence: 1.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.0
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.50
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_timeout: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.5

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
